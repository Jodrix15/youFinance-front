<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouFinance</title>
    <meta name="description" content="Gestión de finanzas personales." />

    <!-- Iconos. Sin esto, al añadir la web a la pantalla de inicio el móvil
         genera un icono gris con la inicial. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest: lo usa Chrome/Android para el icono y el nombre, y para abrir
         la app sin barra de navegador (display: standalone). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Color de la barra de estado. Coincide con --bg0 de cada tema. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2f5" />

    <!-- iOS ignora el manifest para esto: necesita sus propias etiquetas. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouFinance" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
